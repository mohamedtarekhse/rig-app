services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-please-change-this}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-rigways}
      DB_USER: ${DB_USER:-rigways}
      DB_PASSWORD: ${DB_PASSWORD:-rigways_password}
    restart: unless-stopped
    depends_on:
      - mysql
    networks:
      - internal
      - coolify

  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-rigways}
      MYSQL_USER: ${DB_USER:-rigways}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rigways_password}
    restart: unless-stopped
    volumes:
      - mysql_data_v2:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    networks:
      internal:
        aliases:
          - mysql

volumes:
  mysql_data_v2:

networks:
  internal:
    driver: bridge
  coolify:
    external: true